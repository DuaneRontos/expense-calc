spring:
  application:
    name: expense-calc-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expensecalc}
    username: ${DB_USERNAME:expensecalc}
    password: ${DB_PASSWORD:expensecalc}

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` fails loudly on drift; `update`
      # would silently mutate tables and make migrations meaningless.
      ddl-auto: validate
    # Off deliberately: open-in-view hides lazy loading behind the request
    # boundary, which is how N+1 queries reach production unnoticed (spec §10).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Audit Instants are stored UTC. Reporting periods convert to
          # Asia/Manila at query time — see app.reporting.zone below.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No migrations yet. The first one lands with the expense model (#5).

# ---------------------------------------------------------------------------
# Decisions from docs/SPECIFICATION.md, parked here so they have one home.
# Nothing reads them yet; the consuming issue is noted on each.
# ---------------------------------------------------------------------------
app:
  # Set to "production" wherever this is deployed. With the insecure-local
  # profile active it makes the application refuse to start rather than serve
  # an unauthenticated API (spec §9.2, SecurityStartupGuard).
  deployment: ${APP_DEPLOYMENT:local}

  # spec §9.2 — single-user credentials and token settings. No defaults: a
  # default secret is a published secret, so the app refuses to start without
  # these rather than falling back to something that works and is worthless.
  # docs/RUNNING-LOCALLY.md has the command that generates a password hash.
  auth:
    username: ${APP_AUTH_USERNAME:}
    password-hash: ${APP_AUTH_PASSWORD_HASH:}
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    # Short because an access token cannot be revoked; its lifetime is the
    # window a leaked one works in.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # issue #51 — how long an expired row is kept before deletion. Not a
    # security setting: the row is retained past expiry so a replayed token
    # stays distinguishable from one that never existed. Past this window that
    # distinction buys nothing and the row is only a slow leak.
    refresh-token-retention: 7d
    # Daily, off-peak. A cron rather than a fixed delay so the job never fires
    # during startup. The only definition of this default — RefreshTokenCleanup
    # references it without one, so there is no second copy to drift.
    refresh-token-cleanup-cron: ${APP_AUTH_REFRESH_TOKEN_CLEANUP_CRON:0 15 3 * * *}
    # Pinned, because @Scheduled otherwise resolves the cron against the JVM
    # default — UTC in a container, which puts "03:15 off-peak" in the middle of
    # a Manila working day. Its own key rather than reusing app.reporting.zone:
    # a housekeeping schedule and a reporting period are different decisions
    # that happen to share a value today.
    refresh-token-cleanup-zone: ${APP_AUTH_REFRESH_TOKEN_CLEANUP_ZONE:Asia/Manila}

  # issue #58 — which browser origins may call this API. Empty by default, so
  # an unconfigured deployment is reachable only from its own origin; a browser
  # refuses a cross-origin response the server has not named. Set this wherever
  # the web client is served from, comma-separated, scheme and port included.
  # Only browsers are affected — iOS and Android send no Origin header.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    # False until #57 moves the refresh token into a cookie. That change also
    # has to restore CSRF protection, and it forbids a wildcard origin.
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:false}

  # spec §4 / §9.6 — v1 is Philippine Peso only. Anything else is rejected at
  # the API boundary with a 400, before persistence. Consumed by #5.
  currency: PHP

  reporting:
    # spec §4 — relative periods ("this month", "last 30 days") resolve against
    # this zone, never UTC and never the host default. At 17:00 UTC on 31 Jan
    # it is already February in Manila. Consumed by #12.
    zone: Asia/Manila
