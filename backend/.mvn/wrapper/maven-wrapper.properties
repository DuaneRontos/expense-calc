wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
# The wrapper downloads the distribution on every fresh checkout and aborts if
# this does not match, so a compromised or corrupted mirror cannot hand the
# build an archive it then executes with write access to the workspace and
# ~/.m2. Replacing the Gradle setup action's wrapper validation, which the
# migration to Maven removed.
#
# Maven Central publishes only .sha512 for this artifact, so this value was
# derived: download verified against the published
# apache-maven-3.9.16-bin.zip.sha512, then SHA-256 computed from the verified
# file. Re-derive the same way when bumping distributionUrl.
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
