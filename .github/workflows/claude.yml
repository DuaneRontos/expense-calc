name: Claude

# Interactive agent. Mention @claude in an issue, a PR comment, or a review
# and Claude picks up the thread, does the work, and pushes a branch/PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Serialize per issue/PR so two mentions on the same thread can't run
# concurrently and race each other pushing to the same branch. Different
# threads still run in parallel. Not cancel-in-progress: killing an agent
# mid-run can leave a half-pushed branch behind.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Without this guard every comment on the repo starts a billed run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # read the repo, push branches
      pull-requests: write   # open PRs, comment
      issues: write          # comment back on the issue
      id-token: write        # OIDC token for the action
    steps:
      # Which ref to check out, resolved before checkout so the answer is
      # available to it.
      #
      # `pull_request` events hand actions/checkout the PR's merge commit; none
      # of this job's four events is one, so checkout falls back to the default
      # branch. On a PR mention that landed the agent in a tree holding none of
      # the PR's files: its changed-file SHAs came back "unknown" and it spent
      # nine turns on code that was not there. Issue mentions were unaffected,
      # since branching from the default branch is right for those.
      #
      # Only an open, same-repo PR resolves to a branch. The other two cases
      # both resolve to empty, which leaves checkout on the default branch and
      # lets the action create a fresh branch itself:
      #
      #  - Merged or closed: a merged PR's work is already in the default
      #    branch, so that is the tree worth reasoning about — and the head
      #    branch may be gone, in which case checkout fails hard on a missing
      #    ref ("A branch or tag with the name X could not be found") before the
      #    action can post anything. Deleted by hand, not by
      #    `deleteBranchOnMerge`, which is false here. Closed-without-merging is
      #    the weak case — that branch often survives, and neither reason above
      #    applies to it — but the state check cannot tell the difference
      #    cheaply, and failing checkout is worse than reading the wrong tree.
      #    The action already handles these by branching from the default
      #    branch.
      #  - Forks: the action converts a detached PR-head checkout into a real
      #    branch and pushes to `origin`, which is *this* repo — so a commit
      #    would land here as a branch attached to no PR while the fork saw
      #    nothing. Until someone needs that case, do not pretend to support it.
      - id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        run: |
          ref=''
          if [ "$IS_PR" = "true" ]; then
            # One API call, and gh's own --jq rather than the jq binary, so
            # this does not depend on what the runner image happens to ship.
            IFS=$'\t' read -r state cross head < <(
              gh pr view "$PR_NUMBER" --repo "$REPO" \
                --json state,isCrossRepository,headRefName \
                --jq '[.state, (.isCrossRepository | tostring), .headRefName] | @tsv'
            )
            if [ "$state" = "OPEN" ] && [ "$cross" = "false" ]; then
              ref="$head"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "checkout ref: ${ref:-<default branch>}"

      # The agent needs a working tree to read and edit the repo, and full
      # history so it can branch from the right base.
      #
      # fetch-depth: 0 is doubly load-bearing now that `ref` is set explicitly:
      # a positive depth narrows the refspec to the checked-out branch alone,
      # and `origin/main` — which the action's own prompt tells the agent to
      # diff against — would not exist in the tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}

      # Everything below exists so this agent can *run* things. It could not.
      #
      # `claude-code-review.yml` has had a JDK, Node, `npm ci` and a Bash
      # allowlist for a while; this workflow had none of them, and nobody
      # noticed because the automatic reviewer is the one that usually
      # executes. But CLAUDE.md points at `@claude` as the re-review path after
      # pushing fixes — so *every re-review was reasoning-only* while the first
      # review of the same PR was fully executed. On #130 the re-review opened
      # by saying so: `npm`, `node` and `npx` all refused, `node_modules`
      # absent, "I could not re-run your mutation checks". It still found a real
      # tautological test by reading, and it was right — but it had to publish
      # the finding as a guess and ask the author to settle it.
      #
      # The same JDK and Node pins as `ci.yml` and the reviewer, for the same
      # reason: an agent testing on a different runtime than the merge gate
      # reports failures nobody else sees.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installed rather than left to the agent, exactly as in the reviewer.
      # Reasoning about react-native internals instead of reading them is what
      # produced the confidently-wrong remedies in #71 and #83; the packages
      # sitting uninstalled a directory away is what forced it. Cached, so it
      # costs about ten seconds.
      #
      # Unconditional, including on issue mentions: an agent asked to implement
      # something in `frontend/` needs the tree installed before it can check
      # its own work, and that is most of what this workflow is asked to do.
      #
      # `continue-on-error` because this step runs *before* the action, and the
      # action's first act is to create its tracking comment. Without it a
      # failed install kills the job before any comment exists — someone types
      # `@claude` and nothing happens at all, which reads as a broken agent
      # rather than a broken lockfile. The failure case is adversarially well
      # chosen: a dependency bump with `package.json` and the lockfile out of
      # step, or a hand-resolved lockfile conflict, is exactly the PR where
      # someone asks for help. The agent starts either way and can report the
      # install failure itself.
      - working-directory: frontend
        continue-on-error: true
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription-backed OAuth, not an API key. The API key had no
          # credit — platform.claude.com billing is separate from a claude.ai
          # Pro/Max subscription, and the subscription does not fund it.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Without this the SDK result field is stripped, so a run that fails
          # on is_error:true reports only whatever noise preceded it — which is
          # how a wrong-tree checkout came to look like a git hash-object
          # failure. claude-code-review.yml has carried this since #29; this
          # workflow needed it for the same reason and did not have it.
          show_full_output: true

          # Opus, because it reviews better. Costs more of the shared
          # subscription pool per run than the action's Sonnet default — CI and
          # interactive Claude Code draw on the same quota, so this stays the
          # first thing to drop if runs start failing with is_error:true
          # (claude-code-action#1614).
          #
          # Dropped once already, in #74: during the 2026-08-24 "Elevated
          # errors for multiple models" incident, which named claude-opus-5
          # specifically, three consecutive runs died on 529 Overloaded — with
          # 3, 5 and then 10 internal retries each — while the pin sent every
          # attempt straight at the affected model. Restored the same day once
          # that incident was marked resolved on status.claude.com.
          #
          # The lesson from that round is the diagnosis, not the pin: 529
          # Overloaded on a pinned model during a named incident means unpin
          # and wait it out, not debug the workflow. Check the status page
          # before changing anything here.
          #
          # Keep the two workflows in step: a pin here and not in
          # claude-code-review.yml would make the automatic review and the
          # `@claude` re-review answer as different models, which is a
          # difference nobody would think to look for.
          #
          # **What was missing was the two build tools, not Bash.** Read-only
          # commands already went through — `git log` and `git diff` run fine on
          # a workflow without this line — while `npm` came back "This command
          # requires approval". So the agent could read the tree and never build
          # it, on a repo whose interesting failures are all in the build.
          # Mirrored from `claude-code-review.yml` deliberately: the two agents
          # should be able to verify the same claims the same way, or a
          # re-review cannot confirm what the review found.
          #
          # `npx` is still absent, and still on purpose: it fetches and executes
          # packages from the network, which is a different thing from running
          # this repo's own scripts.
          #
          # **This list adds no ref-moving verbs — but do not read that as a
          # boundary.** The action's tag mode appends `Bash(git add:*)`,
          # `Bash(git commit:*)`, `Bash(git rm:*)` and its own push wrapper to
          # whatever is here, because that is how this agent commits at all.
          # Flags accumulate rather than overwrite, so omitting the write verbs
          # neither removes them nor could. `claude-code-review.yml` genuinely
          # has no ref-moving verbs — `contents: read`, no tag mode — and this
          # workflow does not, despite sharing the string.
          #
          # Fork PRs never reach any of this: the checkout step above refuses a
          # cross-repo head. Its stated reason is different — the action would
          # push the resulting branch to *this* repo — but the effect is what
          # matters here, because `npm ci` runs lifecycle scripts from the
          # checked-out tree, and same-repo-only means anyone who could poison
          # it already has write access.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Bash(cd:*),Bash(./mvnw:*),Bash(backend/mvnw:*),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git blame:*)"
