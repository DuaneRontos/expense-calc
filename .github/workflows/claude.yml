name: Claude

# Interactive agent. Mention @claude in an issue, a PR comment, or a review
# and Claude picks up the thread, does the work, and pushes a branch/PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Serialize per issue/PR so two mentions on the same thread can't run
# concurrently and race each other pushing to the same branch. Different
# threads still run in parallel. Not cancel-in-progress: killing an agent
# mid-run can leave a half-pushed branch behind.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Without this guard every comment on the repo starts a billed run.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # read the repo, push branches
      pull-requests: write   # open PRs, comment
      issues: write          # comment back on the issue
      id-token: write        # OIDC token for the action
    steps:
      # Which ref to check out, resolved before checkout so the answer is
      # available to it.
      #
      # None of this job's four events is a `pull_request` event, and only that
      # event family gives actions/checkout the PR's code. `issue_comment`,
      # `pull_request_review` and `pull_request_review_comment` all run against
      # the default branch, so checkout's default landed the agent in a tree
      # with none of the PR's files — it died computing SHAs for every changed
      # path ("could not open ... No such file or directory") in about 30s. A
      # PR mention had therefore never worked; only issue mentions did, where
      # branching from the default branch is the right thing.
      #
      # Same-repo PRs check out the head branch by name, so the agent can
      # commit and push to the PR it was asked about. Forks check out the
      # read-only `refs/pull/N/head`, whose branch does not exist here to push
      # to. Non-PR events resolve to empty, which leaves checkout on its default.
      - id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        run: |
          ref=''
          if [ "$IS_PR" = "true" ]; then
            cross=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isCrossRepository -q .isCrossRepository)
            if [ "$cross" = "true" ]; then
              ref="refs/pull/$PR_NUMBER/head"
            else
              ref=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "checkout ref: ${ref:-<default branch>}"

      # The agent needs a working tree to read and edit the repo, and full
      # history so it can branch from the right base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription-backed OAuth, not an API key. The API key had no
          # credit — platform.claude.com billing is separate from a claude.ai
          # Pro/Max subscription, and the subscription does not fund it.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Opus costs more of the shared subscription pool per run than the
          # action's Sonnet default. CI and interactive Claude Code draw on the
          # same quota, so this is the first thing to drop if runs start
          # failing with is_error:true (claude-code-action#1614).
          claude_args: --model claude-opus-5
