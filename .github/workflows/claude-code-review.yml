name: Claude Code Review

# Automatic agent, but once per PR rather than once per push.
#
# `synchronize` used to be here, so every push started a full review. On #36
# that meant four rounds of ~6 minutes of Opus for one PR, each re-reading the
# whole changed file set — and the later rounds spent much of their budget
# re-verifying the previous round's fixes before finding anything new. Reviews
# draw on the same subscription quota as interactive Claude Code, so that is
# quota taken from the person waiting at a terminal.
#
# Dropping it costs no capability: claude.yml answers `@claude` on a PR comment,
# so a re-review after pushing fixes is one comment away. Explicit beats
# automatic here because only the author knows whether a push is worth another
# round — a typo fix is not.
#
# paths-ignore covers .github/** because the action *cannot* review a PR that
# edits its own workflow: it validates the file against the default branch's
# copy and skips itself when they differ. #37 burned a job proving it. Markdown
# stays in scope — a docs PR is worth reviewing.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - '.github/**'

# Rarer now that pushes don't trigger this, but `opened` on a PR created ready
# and an immediate `ready_for_review` can still overlap. Keep only the newest.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A draft is work in progress by definition; reviewing one spends a round on
    # code the author already knows is unfinished. `ready_for_review` above is
    # what brings it back.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Required. Without a working tree the action cannot diff the PR — it
      # fails on `git hash-object` and `git fetch`. fetch-depth: 0 because a
      # shallow clone leaves it unable to resolve the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR merged between queueing and runner pickup sends the action down
      # its closed-PR path: it creates a local `claude/pr-N-<ts>` branch, then
      # 404s on `compare/main...claude%2Fpr-N-<ts>` because that branch is
      # never pushed. That failure is indistinguishable from a real one in the
      # checks list. Reviewing a merged PR is moot anyway — skip instead.
      - id: pr_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json state -q .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "PR is $state"

      # The reviewer runs the backend suite, so it needs the same JDK CI uses.
      # ubuntu-latest ships a JDK, but not necessarily 21 as the default, and a
      # reviewer testing on a different JDK than CI would report failures the
      # merge gate never sees. cache: maven keeps the extra minute off the run.
      - if: steps.pr_state.outputs.state == 'OPEN'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - if: steps.pr_state.outputs.state == 'OPEN'
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription-backed OAuth, not an API key. The API key returned
          # "credit balance is too low": platform.claude.com is prepaid and
          # separate from a claude.ai Pro/Max subscription. Reviews now draw
          # on the subscription, which shares quota with interactive use.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Disables the sanitizer that strips the SDK result field, so the
          # real API status, retry-after, and rate-limit headers reach the job
          # log. Without this a quota rejection and an invalid token are
          # indistinguishable from CI output (claude-code-action#880).
          show_full_output: true
          track_progress: true
          prompt: |
            Review this pull request. This repo is a Java Spring Boot backend
            plus a React Native frontend for an expense calculator.

            Focus on:
            - Correctness bugs in expense classification, sorting, and filtering
            - Money handling: BigDecimal over float/double, rounding, currency
            - Date and timezone handling in reporting periods
            - N+1 queries and unbounded result sets in repository/service code
            - React Native: unnecessary re-renders, missing keys, unstable
              chart data props

            Report every issue you find, including low-severity ones. For each,
            give file:line, the concrete failure case, and a suggested fix. Say
            plainly if you found nothing worth flagging.

            You can run the backend suite:

                cd backend && ./mvnw -B -q verify

            `-q` because a passing Maven build prints a few thousand tokens of
            INFO you would read back into context for nothing. Failures still
            print. Drop it if you need the full log to diagnose something.

            Tests need Docker for the Testcontainers suites; the runner has it.
            Reproduce a bug before reporting it, and run the fix you are about
            to suggest before suggesting it. Say which findings you executed and
            which you only read, so the author knows what is verified.

          # Bash is off by default, so the reviewer could read code but never
          # run it — and unexecuted remedies have been wrong often enough to
          # cost more than the runtime saves. Scoped rather than opened
          # generally: the build wrapper, and git's read-only verbs.
          #
          # The git verbs were added because the reviewer kept reaching for them
          # and being denied, which cost turns and ended runs on a non-zero exit
          # even when the review itself had completed and posted — a red check
          # that meant nothing. Reading history is also how a reviewer checks
          # whether a claim about a previous PR holds, rather than inferring it.
          #
          # Read-only on purpose. No add, commit, push, checkout, reset, or
          # rebase: this agent reviews, and an agent that can move refs in the
          # repo it is reviewing is a different risk conversation. Note that
          # Claude Code separately refuses `cd <dir> && git ...`, since that can
          # run hooks from the target directory — that guard stands, and this
          # allowlist does not and should not override it.
          #
          # This grants no capability CI does not already exercise: ci.yml runs
          # the same `./mvnw -B verify` on the same `pull_request` trigger. Note
          # that trigger is deliberate — `pull_request` withholds secrets from
          # fork PRs, so the OAuth token, and therefore this job, is unavailable
          # to a fork. Switching it to `pull_request_target` would hand an
          # attacker-authored build both the token and a shell.
          # --model pin — see the note in claude.yml for why Opus, what it
          # costs, and the 2026-08-24 incident that had it dropped for a few
          # hours. The two workflows are kept in step so the automatic review
          # and the `@claude` re-review are never different models.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Bash(cd:*),Bash(./mvnw:*),Bash(backend/mvnw:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git blame:*)"
