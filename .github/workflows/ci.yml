name: CI

# Deliberately separate from the Claude agent workflows. Those depend on a
# subscription quota and an external service; this must stay green regardless
# of whether the reviewer can run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cache: maven replaces the separate Gradle cache action — setup-java
      # handles ~/.m2 itself, so there is no second caching step to conflict
      # with. JDK 21 here matches maven.compiler.release in the POM.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships a running Docker daemon, which is what lets the
      # Testcontainers suites run at all. `verify` rather than `test` so the
      # packaging phase is exercised too.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      # always(), not failure(). Surefire does print counts on success, but they
      # are buried in the log and scroll away; the XML here is the durable,
      # machine-readable record of which suites actually ran. "Did the
      # Testcontainers tests execute or silently skip?" is exactly the question
      # this repo has needed answered, and a console line cannot answer it later.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # frontend/ does not exist until #3. Rather than leave this job out and
      # need another PR later, it self-skips until the scaffold lands.
      - name: Check whether the frontend has been scaffolded
        id: probe
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is not scaffolded yet (#3) — skipping frontend checks."
          fi

      - name: Set up Node
        if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      # --if-present so this does not fail before #3 adds the scripts.
      # Tighten to a hard failure once they exist.
      - name: Lint
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Test
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present
