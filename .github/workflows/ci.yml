name: CI

# Deliberately separate from the Claude agent workflows. Those depend on a
# subscription quota and an external service; this must stay green regardless
# of whether the reviewer can run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installing JDK 21 here means the Gradle toolchain resolves locally.
      # Without it the Foojay resolver downloads a JDK on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Owns Gradle caching and validates the wrapper checksum. Do not also set
      # `cache: gradle` on setup-java — two cache implementations fight.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest ships a running Docker daemon, so this is the first place
      # the Testcontainers tests from #2 and #5 actually execute. They have
      # been written but never run.
      - name: Build and test
        working-directory: backend
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # frontend/ does not exist until #3. Rather than leave this job out and
      # need another PR later, it self-skips until the scaffold lands.
      - name: Check whether the frontend has been scaffolded
        id: probe
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ is not scaffolded yet (#3) — skipping frontend checks."
          fi

      - name: Set up Node
        if: steps.probe.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      # --if-present so this does not fail before #3 adds the scripts.
      # Tighten to a hard failure once they exist.
      - name: Lint
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Test
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present
