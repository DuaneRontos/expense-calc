name: CI

# Deliberately separate from the Claude agent workflows. Those depend on a
# subscription quota and an external service; this must stay green regardless
# of whether the reviewer can run.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cache: maven replaces the separate Gradle cache action — setup-java
      # handles ~/.m2 itself, so there is no second caching step to conflict
      # with. JDK 21 here matches maven.compiler.release in the POM.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships a running Docker daemon, which is what lets the
      # Testcontainers suites run at all. `verify` rather than `test` so the
      # packaging phase is exercised too.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

      # always(), not failure(). Surefire does print counts on success, but they
      # are buried in the log and scroll away; the XML here is the durable,
      # machine-readable record of which suites actually ran. "Did the
      # Testcontainers tests execute or silently skip?" is exactly the question
      # this repo has needed answered, and a console line cannot answer it later.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Bounded because `testTimeout` is 30s: a pathological run of 265 tests is
    # six times longer to fail than it was on jest's 5s default, and without
    # this the job would sit against GitHub's 6-hour ceiling. Comfortably above
    # the ~2 minutes a real run takes: roughly a minute of that is the
    # three-platform bundle below, and the rest a cold-cache test run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # No `--if-present`: it was here so the job would pass before #3 added the
      # scripts, and the note beside it said to tighten once they existed. They
      # do, and until now renaming or deleting any of the three would have left
      # a green job that ran nothing.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      # The only check that compiles the JS for iOS and Android. Lint, types and
      # jest all pass on code that imports a web-only API, and this repo ships
      # three targets from one codebase — so without this a native-only break
      # merges green and is found on a device.
      #
      # `npm run` rather than `npx expo`: the reviewer workflow's allowlist
      # deliberately excludes `npx`, which fetches and executes from the
      # network, so a bare `npx` here would be a check the reviewer cannot run.
      #
      # It produces Hermes bytecode for both native targets without Xcode or
      # Android Studio. It cannot catch a native module that is missing or
      # misconfigured — that still needs a device or a development build.
      - name: Bundle for every target
        working-directory: frontend
        run: npm run export:check
